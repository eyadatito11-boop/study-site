<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>موقع الامتحانات — 2027</title>
<style>
:root{--white:#fff;--burgundy:#7a1f2b;--gray-50:#f6f6f7;--gray-100:#ececee;--gray-900:#242428;--radius:16px;--shadow:0 4px 20px rgba(36,36,40,.08);}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",Tahoma,sans-serif;background:var(--gray-50);color:var(--gray-900);display:flex;flex-direction:column;min-height:100vh;}
.topbar{background:var(--white);border-bottom:1px solid var(--gray-100);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
.brand{font-weight:800;font-size:1.15rem;}
.brand span{color:var(--burgundy)}
.back-btn{background:var(--gray-50);border:1px solid var(--gray-100);padding:8px 14px;border-radius:10px;font-size:.9rem;cursor:pointer;}
.app{flex:1;width:100%;max-width:720px;margin:0 auto;padding:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(min-width:560px){.grid{grid-template-columns:1fr 1fr 1fr}}
.card{background:var(--white);border:1px solid var(--gray-100);border-radius:var(--radius);padding:16px;cursor:pointer;box-shadow:var(--shadow);}
.card .title{font-weight:700;font-size:1rem;}
.row{background:var(--white);border:1px solid var(--gray-100);border-radius:12px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;box-shadow:var(--shadow);}
.row .r-title{font-weight:600;font-size:.95rem}
.btn{display:block;width:100%;text-align:center;background:var(--burgundy);color:#fff;border:none;padding:15px;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;margin-top:16px;}
.q-block{background:var(--white);border:1px solid var(--gray-100);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow);}
.q-text{font-weight:700;margin-bottom:12px}
.opt{display:block;padding:12px 14px;border:1.5px solid var(--gray-100);border-radius:10px;margin-bottom:8px;cursor:pointer;}
.opt.sel{border-color:var(--burgundy);background:#fdf5f6}
.opt.correct{border-color:#2e7d32;background:#eef8ee}
.opt.wrong{border-color:#c62828;background:#fdeeee}
.signature{position:fixed;bottom:18px;left:18px;background:var(--burgundy);color:#fff;padding:10px 16px;border-radius:99px;font-size:.82rem;font-weight:800;}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">الامتحانات <span>2027</span></div>
  <button class="back-btn" id="backBtn" hidden onclick="goBack()">← رجوع</button>
</header>
<div class="signature">✦ اياد محمد عطيتو ✦</div>
<main id="app" class="app"></main>

<script>
// هنا بنك الأسئلة
const CURRICULUM = {
  "grade7": { name: "الصف الأول الإعدادي", subjects: {
    "science": { name: "العلوم", units: [
      { title: "امتحان الوحدة الأولى: المادة", quiz: [
        {q:"أي الجسيمات يحمل شحنة موجبة؟", opts:["الإلكترون","البروتون","النيوترون","الفوتون"], a:1},
        {q:"العدد الذري يعبر عن عدد...", opts:["النيوترونات","الإلكترونات","البروتونات","الكتلة"], a:2},
        {q:"ذرة عددها الكتلي 23 وعددها الذري 11، فكم عدد النيوترونات؟", opts:["11","12","23","34"], a:1},
        {q:"ترتب العناصر في الجدول الدوري حسب...", opts:["العدد الكتلي","العدد الذري","الكتلة الذرية","اللون"], a:1},
        {q:"أي الجسيمات يدور في مدارات حول النواة؟", opts:["البروتون","النيوترون","الإلكترون","النواة"], a:2}
      ]}
    ]}
  }},
  "grade8": { name: "الصف الثاني الإعدادي", subjects: {
    "science": { name: "العلوم", units: [{ title: "امتحان الحركة", quiz: [{q:"جسم قطع 100م في 20ث، سرعته؟", opts:["2","5","10","20"], a:1}]}]}
  }},
  "grade9": { name: "الصف الثالث الإعدادي", subjects: {
    "science": { name: "العلوم", units: [{ title: "امتحان القوى", quiz: [{q:"قانون القصور الذاتي هو...", opts:["الأول","الثاني","الثالث"], a:0}]}]}
  }}
};

const app = document.getElementById('app');
const backBtn = document.getElementById('backBtn');
let history = [];

function render(html) { app.innerHTML = html; }
function goBack() { if(history.length > 0) { history.pop(); const last = history[history.length-1]; if(!last) renderHome(); else last(); backBtn.hidden = history.length <= 1; } }

function renderHome() {
  render(`<h1 style="margin-bottom:20px">اختر الصف للامتحان</h1><div class="grid" id="g"></div>`);
  const g = document.getElementById('g');
  Object.entries(CURRICULUM).forEach(([id, data]) => {
    const d = document.createElement('div');
    d.className = 'card'; d.innerHTML = `<div class="title">${data.name}</div>`;
    d.onclick = () => nav(() => renderSubjects(id));
    g.appendChild(d);
  });
}

function renderSubjects(gradeId) {
  const grade = CURRICULUM[gradeId];
  render(`<h1 style="margin-bottom:20px">${grade.name}</h1><div class="grid" id="s"></div>`);
  const box = document.getElementById('s');
  Object.entries(grade.subjects).forEach(([id, data]) => {
    const d = document.createElement('div');
    d.className = 'card'; d.innerHTML = `<div class="title">${data.name}</div>`;
    d.onclick = () => nav(() => renderUnits(gradeId, id));
    box.appendChild(d);
  });
}

function renderUnits(gradeId, subId) {
  const sub = CURRICULUM[gradeId].subjects[subId];
  render(`<h1 style="margin-bottom:20px">${sub.name}</h1><div id="u"></div>`);
  const box = document.getElementById('u');
  sub.units.forEach((unit, ui) => {
    const d = document.createElement('div');
    d.className = 'row'; d.innerHTML = `<div class="r-title">${unit.title}</div><div>‹</div>`;
    d.onclick = () => nav(() => startQuiz(gradeId, subId, ui));
    box.appendChild(d);
  });
}

function nav(renderFn) {
  history.push(renderFn);
  renderFn();
  backBtn.hidden = history.length <= 1;
}

function startQuiz(g,s,u) {
  const unit = CURRICULUM[g].subjects[s].units[u];
  let html = `<h1>${unit.title}</h1><div id="qs"></div><button class="btn" id="sub">تصحيح الامتحان</button><div id="res"></div>`;
  render(html);
  const qs = document.getElementById('qs');
  const answers = new Array(unit.quiz.length).fill(-1);
  
  unit.quiz.forEach((q, qi) => {
    let qh = `<div class="q-block"><div class="q-text">${qi+1}. ${q.q}</div>`;
    q.opts.forEach((o, oi) => qh += `<div class="opt" onclick="selectOpt(this,${qi},${oi})">${o}</div>`);
    qh += `</div>`;
    qs.innerHTML += qh;
  });
  
  window.selectOpt = (el, qi, oi) => {
    el.parentNode.querySelectorAll('.opt').forEach(x => x.classList.remove('sel'));
    el.classList.add('sel');
    answers[qi] = oi;
  };

  document.getElementById('sub').onclick = () => {
    let score = 0;
    unit.quiz.forEach((q, qi) => {
      const block = qs.children[qi];
      block.querySelectorAll('.opt').forEach((el, oi) => {
        if(oi === q.a) el.classList.add('correct');
        else if(oi === answers[qi]) el.classList.add('wrong');
      });
      if(answers[qi] === q.a) score++;
    });
    document.getElementById('res').innerHTML = `<div style="text-align:center;font-size:2rem;color:var(--burgundy);margin-top:20px">${score} / ${unit.quiz.length}</div>`;
    document.getElementById('sub').disabled = true;
  };
}

renderHome();
</script>
</body>

const app = document.getElementById('app');
const backBtn = document.getElementById('backBtn');
let history = [];

function render(html) { app.innerHTML = html; }
function goBack() { if(history.length > 0) { history.pop(); const last = history[history.length-1]; if(!last) renderHome(); else last(); backBtn.hidden = history.length <= 1; } }

function renderHome() {
  render(`<h1 style="margin-bottom:20px">امتحانات الصف الثاني الإعدادي (ترم أول)</h1><div class="grid" id="g"></div>`);
  const g = document.getElementById('g');
  Object.entries(CURRICULUM).forEach(([id, data]) => {
    const d = document.createElement('div');
    d.className = 'card'; d.innerHTML = `<div class="title">${data.name}</div>`;
    d.onclick = () => nav(() => renderSubjects(id));
    g.appendChild(d);
  });
}

function renderSubjects(gradeId) {
  const grade = CURRICULUM[gradeId];
  render(`<h1 style="margin-bottom:20px">اختر المادة</h1><div class="grid" id="s"></div>`);
  const box = document.getElementById('s');
  Object.entries(grade.subjects).forEach(([id, data]) => {
    const d = document.createElement('div');
    d.className = 'card'; d.innerHTML = `<div class="title">${data.name}</div>`;
    d.onclick = () => nav(() => renderUnits(gradeId, id));
    box.appendChild(d);
  });
}

function renderUnits(gradeId, subId) {
  const sub = CURRICULUM[gradeId].subjects[subId];
  render(`<h1 style="margin-bottom:20px">${sub.name}</h1><div id="u"></div>`);
  const box = document.getElementById('u');
  sub.units.forEach((unit, ui) => {
    const d = document.createElement('div');
    d.className = 'row'; d.innerHTML = `<div class="r-title">${unit.title}</div><div>‹</div>`;
    d.onclick = () => nav(() => startQuiz(gradeId, subId, ui));
    box.appendChild(d);
  });
}

function nav(renderFn) {
  history.push(renderFn);
  renderFn();
  backBtn.hidden = history.length <= 1;
}

function startQuiz(g,s,u) {
  const unit = CURRICULUM[g].subjects[s].units[u];
  let html = `<h1>${unit.title}</h1><div id="qs"></div><button class="btn" id="sub">تصحيح الامتحان</button><div id="res"></div>`;
  render(html);
  const qs = document.getElementById('qs');
  const answers = new Array(unit.quiz.length).fill(-1);
  
  unit.quiz.forEach((q, qi) => {
    let qh = `<div class="q-block"><div class="q-text">${qi+1}. ${q.q}</div>`;
    q.opts.forEach((o, oi) => qh += `<div class="opt" onclick="selectOpt(this,${qi},${oi})">${o}</div>`);
    qh += `</div>`;
    qs.innerHTML += qh;
  });
  
  window.selectOpt = (el, qi, oi) => {
    el.parentNode.querySelectorAll('.opt').forEach(x => x.classList.remove('sel'));
    el.classList.add('sel');
    answers[qi] = oi;
  };

  document.getElementById('sub').onclick = () => {
    let score = 0;
    unit.quiz.forEach((q, qi) => {
      const block = qs.children[qi];
      block.querySelectorAll('.opt').forEach((el, oi) => {
        if(oi === q.a) el.classList.add('correct');
        else if(oi === answers[qi]) el.classList.add('wrong');
      });
      if(answers[qi] === q.a) score++;
    });
    document.getElementById('res').innerHTML = `<div style="text-align:center;font-size:2rem;color:var(--burgundy);margin-top:20px">${score} / ${unit.quiz.length}</div>`;
    document.getElementById('sub').disabled = true;
  };
}

renderHome();
